services:
  itdm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kangoding-itdm
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - DATA_DIR=/app/server/data
    volumes:
      # Mount folder data lokal agar perubahan database json tersimpan permanen
      - ./server/data:/app/server/data
    env_file:
      - path: .env
        required: false
